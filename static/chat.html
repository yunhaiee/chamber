<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counsel Box</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="root"></div>
<script src="/static/common.js"></script>
<script>
const root = document.getElementById('root');
const SHORT = { summarize_deposition: 'Summarize deposition', extract_dates: 'Pull dates', privilege_tag: 'Privilege tag', draft_letter: 'Letter', public_research: 'Research', advice: 'Advice',
  summarize_instrument: 'Summarize will', extract_beneficiaries: 'Beneficiaries', compute_distribution: 'Distributions', draft_client_letter: 'Client letter', public_deadline: 'Public lookup', public_limit: 'Fee or limit' };
const DOTS = '<div class="thinking" aria-label="Working"><span></span><span></span><span></span></div>';
const state = { me: null, last: '', tryItems: [], docs: [], attached: [], tried: null, sending: null, expanded: new Set() };

function destClass(label) {
  if (!label) return '';
  if (label.startsWith('TESTING')) return 'testing';
  if (label.startsWith('CLOUD')) return 'claude';
  if (label.startsWith('HUMAN')) return 'lawyer';
  if (label.startsWith('ON DEVICE') || label.startsWith('KEPT')) return 'box';
  return 'blocked';
}

function shell() {
  root.innerHTML = `<div class="chat empty" id="chat">
    <header><div class="who">${esc(state.me.matters.map(m => m.name).join(', '))}</div><span id="online" class="muted"></span></header>
    <div class="log" id="log"></div>
    <div class="tools"><div id="try"></div></div>
    <div class="composerwrap"><div class="composer">
      <div class="attached" id="attached"></div>
      <textarea id="text" rows="1" placeholder="Ask anything" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" spellcheck="false"></textarea>
      <div class="composerrow">
        <div class="attachmenu" id="attachmenu"><button type="button" id="attachbtn">+ Attach file</button><div class="attachlist" id="attachlist" hidden></div></div>
        <div class="taskmenu" id="taskmenu"><button type="button" id="taskbtn">Tasks ▾</button><div class="tasklist" id="tasklist" hidden></div></div>
        <span class="spacer"></span>
        <div class="modelmenu" id="modelmenu"><button type="button" id="modelbtn" aria-haspopup="listbox"></button><div class="modellist" id="modellist" role="listbox" hidden></div></div>
        <button id="send" aria-label="Send">↑</button>
      </div>
    </div></div>
  </div>`;
  document.getElementById('attachbtn').onclick = () => { const l = document.getElementById('attachlist'); l.hidden = !l.hidden; };
  const text = document.getElementById('text');
  text.onkeydown = ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send(); } };
  text.oninput = () => { autosize(); if (state.tried && text.value !== state.tried.text) state.tried = null; };
  document.getElementById('send').onclick = send;
  document.getElementById('taskbtn').onclick = async () => { const l = document.getElementById('tasklist'); if (l.hidden) await loadTry(); l.hidden = !l.hidden; };
  document.getElementById('modelbtn').onclick = () => { const l = document.getElementById('modellist'); l.hidden = !l.hidden; };
  window.addEventListener('blur', () => { document.getElementById('modellist').hidden = true; document.getElementById('attachlist').hidden = true; document.getElementById('tasklist').hidden = true; });
  document.addEventListener('click', ev => {
    if (!ev.target.closest('#modelmenu')) document.getElementById('modellist').hidden = true;
    if (!ev.target.closest('#attachmenu')) document.getElementById('attachlist').hidden = true;
    if (!ev.target.closest('#taskmenu')) document.getElementById('tasklist').hidden = true;
  });
}

function autosize() {
  const t = document.getElementById('text');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 160) + 'px';
}

function renderModelMenu() {
  document.getElementById('modelbtn').textContent = `${state.model} ▾`;
  const list = document.getElementById('modellist');
  const html = state.models.map(m => `<button type="button" role="option" data-model="${esc(m)}" class="${m === state.model ? 'on' : ''}">Liquid · ${esc(m)}</button>`).join('');
  if (list.dataset.html === html) return;
  list.innerHTML = html;
  list.dataset.html = html;
  list.querySelectorAll('[data-model]').forEach(b => b.onclick = async () => {
    list.hidden = true;
    state.choosing = b.dataset.model;
    state.model = b.dataset.model;
    renderModelMenu();
    await post('/api/model', { model: b.dataset.model });
  });
}

function showAttached() {
  const el = document.getElementById('attached');
  el.innerHTML = state.attached.map(id => {
    const d = state.docs.find(x => x.id === id);
    return `<span class="attachment"><span class="eyebrowish">Privileged file</span>${esc(d ? d.title : '')} <button type="button" data-rm="${id}">×</button></span>`;
  }).join(' ');
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { state.attached = state.attached.filter(x => x !== Number(b.dataset.rm)); showAttached(); });
}

async function loadTry() {
  state.tryItems = await api('/api/try');
  const items = state.tryItems.map((t, i) =>
    `<button class="try" data-i="${i}">${esc(SHORT[t.kind] || t.label)}${t.doc_ids.length ? '<span class="filemark">+ file</span>' : ''}</button>`).join('');
  document.getElementById('try').innerHTML = items;
  document.getElementById('tasklist').innerHTML = items;
  document.querySelectorAll('.try').forEach(b => b.onclick = () => {
    document.getElementById('tasklist').hidden = true;
    const t = state.tryItems[Number(b.dataset.i)];
    document.getElementById('text').value = t.text;
    autosize();
    state.attached = [...t.doc_ids];
    state.tried = t;
    showAttached();
    document.getElementById('text').focus();
  });
}

async function send(textOverride) {
  const box = document.getElementById('text');
  const text = (typeof textOverride === 'string' ? textOverride : box.value).trim();
  if (!text || state.sending) return;
  const docIds = typeof textOverride === 'string' ? [] : state.attached;
  const tried = typeof textOverride === 'string' ? null : state.tried;
  state.sending = { text };
  if (typeof textOverride !== 'string') { box.value = ''; autosize(); state.attached = []; state.tried = null; showAttached(); }
  render();
  try {
    if (tried) await post('/api/try/used', { kind: tried.kind });
    await post('/api/chat', { text, doc_ids: docIds });
    if (tried) await loadTry();
  } finally { state.sending = null; state.last = ''; poll(); }
}

function messageHtml(m) {
  const long = m.text.length > 90;
  const open = state.expanded.has(m.id);
  const cls = destClass(m.label);
  let extra = '';
  if (m.can_fix) extra += `<button data-fix="${m.id}">I had to fix this</button>`;
  if (m.ask === 'choose') {
    return `<div class="ask"><div class="bubble"><div class="body ${long && !open ? 'short' : ''}" data-open="${m.id}">${esc(m.text)}</div></div></div>
      <div><div class="pair"><div><div class="eyebrow">Answer A</div><div class="reply">${esc(m.options.a)}</div></div><div><div class="eyebrow">Answer B</div><div class="reply">${esc(m.options.b)}</div></div></div>
      <div class="small choices"><button data-pick="a" data-id="${m.id}">A is better</button><button data-pick="b" data-id="${m.id}">B is better</button><button data-pick="both" data-id="${m.id}">Both good</button><button data-pick="neither" data-id="${m.id}">Neither</button></div></div>`;
  }
  return `<div class="ask"><div class="bubble"><div class="body ${long && !open ? 'short' : ''}" data-open="${m.id}">${esc(m.text)}</div></div>
      ${m.docs.map(d => `<div><span class="attachment"><span class="eyebrowish">Privileged file</span>${esc(d)}</span></div>`).join('')}</div>
    <div>${m.reply && !(m.label || '').startsWith('HUMAN') ? `<div class="reply">${esc(m.reply)}</div>` : ''}
      ${m.label ? `<div class="line dest ${cls}">${esc(m.label)}</div>` : ''}
      ${m.warning ? `<div class="warn">${esc(m.warning)}</div>` : ''}
      ${m.status === 'working' ? DOTS : ''}
      ${extra ? `<div class="small">${extra}</div>` : ''}
    </div>`;
}

let messages = [];
function render() {
  const log = document.getElementById('log');
  if (!log) return;
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const empty = !messages.length && !state.sending;
  document.getElementById('chat').classList.toggle('empty', empty);
  log.innerHTML = empty ? `<div class="hello">Hi ${esc(state.me.name.split(' ')[0])}, where should we start?</div>` : messages.map(messageHtml).join('') + (state.sending && !messages.some(m => m.status === 'working' && m.text === state.sending.text) ? `<div class="ask"><div class="bubble"><div class="body short">${esc(state.sending.text)}</div></div></div>${DOTS}` : '');
  if (nearBottom || state.sending) log.scrollTop = log.scrollHeight;
  log.querySelectorAll('[data-open]').forEach(el => el.onclick = () => { const id = Number(el.dataset.open); state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render(); });
  log.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => { await post('/api/pick', { request_id: Number(b.dataset.id), choice: b.dataset.pick }); state.last = ''; poll(); });
  log.querySelectorAll('[data-fix]').forEach(b => b.onclick = async () => { await post('/api/fix', { request_id: Number(b.dataset.fix) }); b.textContent = 'Recorded'; });
}

async function poll() {
  try {
    const data = await api('/api/chat');
    state.models = data.models; state.model = state.choosing || data.model;
    if (state.choosing === data.model) state.choosing = null;
    renderModelMenu();
    document.getElementById('online').textContent = (data.online ? 'Online' : 'Offline') + (data.standin ? ` · Cloud: ${data.cloud}` : '');
    const snapshot = JSON.stringify(data.messages);
    if (snapshot !== state.last) { state.last = snapshot; messages = data.messages; render(); }
  } catch (e) { if (e.signin) location.reload(); }
}

const pane = new URLSearchParams(location.search).get('pane');
signIn(root, pane, async () => {
  state.me = await api('/api/me');
  if (state.me.role === 'partner') { location.href = '/'; return; }
  shell();
  state.docs = await api('/api/docs');
  const list = document.getElementById('attachlist');
  list.innerHTML = state.docs.map(d => `<button type="button" data-doc="${d.id}">${esc(d.title)}</button>`).join('');
  list.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.doc);
    if (!state.attached.includes(id)) state.attached.push(id);
    list.hidden = true;
    showAttached();
  });
  await loadTry();
  await poll();
  setInterval(poll, 1000);
});
</script></body></html>
