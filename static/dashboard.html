<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chamber</title><link rel="icon" href="/static/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"></head>
<body><div id="root"></div>
<script src="/static/common.js"></script>
<script>
const root = document.getElementById('root');
const EMBEDDED = new URLSearchParams(location.search).get('pane') === 'partner';
const TABS = [['board', 'Board'], ['requests', 'Requests'], ['masking', 'Masking'], ...(EMBEDDED ? [] : [['people', 'People']])];
const ROLE_WORD = { head: 'Head of firm', manager: 'Manager', employee: 'Employee' };
const DEST_WORD = { box: 'On device', claude: 'Cloud', lawyer: 'Human', blocked: 'Blocked' };
const TYPE_CLASS = { Testing: 'testing', 'On device': 'box', Cloud: 'claude', Human: 'lawyer' };
const ROUTES = [
  { id: 'box', word: 'On device' }, { id: 'claude', word: 'Cloud, names masked' },
  { id: 'lawyer', word: 'Human' }, { id: 'blocked', word: 'Blocked' },
];
const NO_FILTER = { user: '', kind: '', dest: '' };
const ui = { people: [], tasks: {}, kinds: [], boardPerson: null, flowBy: 'person', tab: 'board', types: null, selected: null, pinned: false, autoPick: false, filter: { ...NO_FILTER }, seenMask: null, last: {} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function shell() {
  root.innerHTML = `<div class="top">${BRAND}<span id="tabs"></span>${EMBEDDED ? '' : '<nav class="topnav"><a href="/">Chat</a><button type="button" id="signout">Sign out</button></nav>'}</div><main id="main"></main><div id="tip" role="status"></div>`;
  document.getElementById('signout')?.addEventListener('click', signOut);
  renderTabs();
}
function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(([id, name]) => `<button class="tab ${ui.tab === id ? 'on' : ''}" data-tab="${id}">${name}</button>`).join('');
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(tab) {
  if (tab === 'requests') ui.filter = { ...NO_FILTER };
  ui.tab = tab; ui.last = {}; hideTip(); renderTabs(); document.getElementById('main').innerHTML = ''; tick();
}

// A band, label or cell on the Board opens the requests behind it, with the newest one already open.
function openRequests(filter) {
  ui.filter = { ...NO_FILTER, ...filter };
  ui.selected = null; ui.pinned = false; ui.autoPick = true;
  go2Requests();
}
function go2Requests() { ui.tab = 'requests'; ui.last = {}; hideTip(); renderTabs(); document.getElementById('main').innerHTML = ''; tick(); }

function showTip(ev, text) {
  const tip = document.getElementById('tip');
  tip.textContent = text; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - 270) + 'px';
  tip.style.top = ev.clientY + 14 + 'px';
}
function hideTip() { const tip = document.getElementById('tip'); if (tip) tip.style.display = 'none'; }

function strikes(score, needed) {
  const marks = (score ? score.marks : []).map(ok => `<span class="dot ${ok ? 'pass' : 'miss'}"></span>`);
  for (let i = marks.length; i < needed; i++) marks.push('<span class="dot"></span>');
  return `<span class="dots">${marks.join('')}</span>`;
}

function scoreText(score) { return score && score.total ? `${score.right} of ${score.total} right` : 'not tested yet'; }

function cellTip(r) {
  if (r.type === 'Human') return 'No model answers this. A human decides.';
  if (r.state === 'LOCAL') return 'Stays on device. Never sent to the cloud.';
  const t = v => v ? ` (${(v / 1000).toFixed(1)}s median)` : '';
  return `On device ${scoreText(r.local)}${t(r.device_ms)}. ${r.cloud ? `Cloud ${scoreText(r.cloud)}${t(r.cloud_ms)}.` : 'Never sent to the cloud.'}`;
}

window.setBoardPerson = person => { ui.boardPerson = person; ui.last.board = null; tick(); };

const goAttr = filter => `data-go="${esc(JSON.stringify(filter))}"`;
const plural = n => `${n} request${n === 1 ? '' : 's'}`;

function flowHtml(data, rows, totals) {
  const byPerson = ui.flowBy === 'person';
  const field = byPerson ? 'user' : 'kind';
  const names = Object.fromEntries(data.people.map(p => [p.user, p.name]));
  const sum = list => list.reduce((a, r) => a + r.n, 0);
  const left = [...new Set(rows.map(r => r[field]))].sort((a, b) => byPerson
    ? data.people.findIndex(p => p.user === a) - data.people.findIndex(p => p.user === b)
    : sum(rows.filter(r => r.kind === b)) - sum(rows.filter(r => r.kind === a)));
  const nameOf = v => byPerson ? names[v] : (data.tasks[v] || v);
  const routes = ROUTES.map((route, i) => ({ ...route, total: totals[i] })).filter(r => r.total);
  const W = Math.max(320, document.getElementById('main').clientWidth - 48);
  const narrow = W < 620, GAP = 14, BAR = 5;
  const X0 = narrow ? 112 : 186, X1 = W - (narrow ? 100 : 206), H = Math.max(240, left.length * 46);
  const trim = t => { const max = narrow ? 13 : 26; return t.length > max ? t.slice(0, max - 1) + '…' : t; };
  const total = sum(rows);
  const unit = (H - 20 - GAP * Math.max(left.length - 1, routes.length - 1)) / total;
  const stack = heights => { const used = heights.reduce((a, b) => a + b, 0) + GAP * (heights.length - 1); let y = (H - used) / 2; return heights.map(h => { const at = y; y += h + GAP; return at; }); };
  const cell = (l, route) => sum(rows.filter(r => r[field] === l && r.dest === route.id));
  const leftH = left.map(l => sum(rows.filter(r => r[field] === l)) * unit);
  const rightH = routes.map(r => r.total * unit);
  const leftY = stack(leftH), rightY = stack(rightH), rightCursor = [...rightY];
  const paint = { box: 'fill="#000" fill-opacity=".2"', claude: 'fill="#9b9b9b" fill-opacity=".3"', lawyer: 'fill="url(#flowhatch)" fill-opacity=".4"', blocked: 'fill="#fff" stroke="#000"' };
  let bands = '';
  left.forEach((l, i) => {
    let cursor = leftY[i];
    routes.forEach((route, r) => {
      const c = cell(l, route);
      if (!c) return;
      const h = c * unit, ya = cursor, yb = rightCursor[r], mx = (X0 + X1) / 2;
      cursor += h; rightCursor[r] += h;
      const d = `M${X0} ${ya}C${mx} ${ya} ${mx} ${yb} ${X1} ${yb}L${X1} ${yb + h}C${mx} ${yb + h} ${mx} ${ya + h} ${X0} ${ya + h}Z`;
      const label = `${nameOf(l)}: ${plural(c)} went to ${route.word.toLowerCase()}. Click to open.`;
      bands += `<g class="flow-band" tabindex="0" role="link" aria-label="${esc(label)}" data-tip="${esc(label)}" ${goAttr({ [field]: l, dest: route.id })}><path ${paint[route.id]} d="${d}"/><path class="hit" d="${d}" stroke-width="${Math.max(10 - h, 0)}"/></g>`;
    });
  });
  const leftMarks = left.map((l, i) => {
    const label = `${nameOf(l)}: open all ${plural(sum(rows.filter(r => r[field] === l)))}`;
    return `<g class="flow-end" tabindex="0" role="link" aria-label="${esc(label)}" data-tip="${esc(label)}" ${goAttr({ [field]: l })}><text x="${X0 - 14}" y="${leftY[i] + leftH[i] / 2 + 5}" text-anchor="end" font-size="14">${esc(trim(nameOf(l)))}</text><rect x="${X0 - BAR}" y="${leftY[i]}" width="${BAR}" height="${Math.max(leftH[i], 3)}" rx="2"/></g>`;
  }).join('');
  const rightMarks = routes.map((route, r) => {
    const label = `${route.word}: open all ${plural(route.total)}`;
    return `<g class="flow-end" tabindex="0" role="link" aria-label="${esc(label)}" data-tip="${esc(label)}" ${goAttr({ dest: route.id })}><rect x="${X1}" y="${rightY[r]}" width="${BAR}" height="${Math.max(rightH[r], 3)}" rx="2"/><text x="${X1 + 16}" y="${rightY[r] + rightH[r] / 2 + 6}" font-size="14"><tspan font-size="20" font-weight="300" letter-spacing="-.5">${route.total}</tspan><tspan dx="7">${narrow ? route.word.split(',')[0] : route.word}</tspan></text></g>`;
  }).join('');
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" width="100%" role="group" aria-label="Where work went"><defs><pattern id="flowhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="2" height="6" fill="#000"/></pattern></defs>${bands}${leftMarks}${rightMarks}</svg>`;
}

function shareHtml(totals, total) {
  const live = ROUTES.map((route, i) => ({ ...route, n: totals[i] })).filter(r => r.n);
  return `<div class="share">${live.map(r => `<button class="seg seg-${r.id}" style="flex:${r.n}" aria-label="Open ${esc(r.word)}" data-tip="${esc(`${r.word}: ${plural(r.n)}. Click to open.`)}" ${goAttr({ dest: r.id })}></button>`).join('')}</div>
    <div class="sharelabels">${live.map(r => `<button ${goAttr({ dest: r.id })}><i class="seg seg-${r.id}"></i><b>${Math.round(r.n / total * 100)}%</b>${r.word}</button>`).join('')}</div>`;
}

function gridHtml(data, rows) {
  const known = ui.types;
  ui.types = new Map();
  const kinds = [...new Set(data.people.flatMap(p => p.rows.map(r => r.kind)))];
  if (!kinds.length) return '';
  const count = (user, kind) => rows.filter(r => r.user === user && r.kind === kind).reduce((a, r) => a + r.n, 0);
  const head = data.people.map(p => `<th class="${EMBEDDED && p.user === ui.boardPerson ? 'on' : ''}"><button class="linkish" ${goAttr({ user: p.user })}>${esc(p.name)}</button></th>`).join('');
  const body = kinds.map(kind => `<tr><td><button class="linkish" ${goAttr({ kind })}>${esc(data.tasks[kind] || kind)}</button></td>${data.people.map(p => {
    const r = p.rows.find(x => x.kind === kind);
    if (!r) return '<td></td>';
    const id = `${p.user}/${kind}`;
    ui.types.set(id, r.type);
    const fresh = known && known.has(id) && known.get(id) !== r.type;
    const n = count(p.user, kind);
    return `<td><button class="cellbtn ${fresh ? 'flash' : ''}" data-tip="${esc(`${p.name}, ${data.tasks[kind] || kind}. ${cellTip(r)}`)}" ${goAttr({ user: p.user, kind })}><span class="state ${TYPE_CLASS[r.type]}">${r.type}</span>${n ? `<span class="count">${n}</span>` : ''}${r.type === 'Testing' ? strikes(r.local, r.needed) : ''}</button></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tablewrap"><table class="routegrid"><tr><th>Task</th>${head}</tr>${body}</table></div>`;
}

function renderBoard(data) {
  const main = document.getElementById('main');
  hideTip();
  if (!data.people.some(p => p.user === ui.boardPerson)) ui.boardPerson = data.people[0]?.user;
  const shown = new Set(data.people.map(p => p.user));
  const rows = data.flow.filter(r => shown.has(r.user));
  const totals = ROUTES.map(route => rows.filter(r => r.dest === route.id).reduce((a, r) => a + r.n, 0));
  const total = totals.reduce((a, b) => a + b, 0);
  const sv = data.savings;
  const secs = ms => ms ? `${(ms / 1000).toFixed(1)}s` : '-';
  const stats = `<div class="stats"><div><b>${sv.avoided}</b><span>cloud calls avoided</span></div><div><b>${secs(sv.device_ms)}</b><span>on device</span></div><div><b>${secs(sv.cloud_ms)}</b><span>cloud</span></div>${data.demo ? `<button class="runday" id="runday">${data.runs.day.running ? 'Running…' : 'Run the firm\'s day'}</button>` : ''}</div>`;
  const toggle = `<div class="toggle">${[['person', 'By person'], ['task', 'By task']].map(([id, word]) => `<button class="${ui.flowBy === id ? 'on' : ''}" data-flowby="${id}">${word}</button>`).join('')}</div>`;
  main.innerHTML = stats + (total
    ? `<section class="boardsec"><div class="sechead"><h2>Where work went</h2>${toggle}</div>${flowHtml(data, rows, totals)}</section>
       <section class="boardsec"><h2>Share of all requests</h2>${shareHtml(totals, total)}</section>`
    : '<div class="muted empty-note">No requests yet. They\'ll appear here as people use Chamber.</div>')
    + (gridHtml(data, rows) ? `<section class="boardsec"><h2>Where each task runs today</h2>${gridHtml(data, rows)}</section>` : '');
  document.getElementById('runday')?.addEventListener('click', () => post('/api/day/start'));
  main.querySelectorAll('[data-flowby]').forEach(b => b.onclick = () => { ui.flowBy = b.dataset.flowby; ui.last.board = null; tick(); });
  main.querySelectorAll('[data-go]').forEach(el => {
    const open = () => openRequests(JSON.parse(el.dataset.go));
    el.onclick = open;
    if (el.tagName.toLowerCase() === 'g') el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } };
  });
  const flow = main.querySelector('.flow');
  main.querySelectorAll('[data-tip]').forEach(el => {
    el.onmousemove = ev => showTip(ev, el.dataset.tip);
    el.onmouseleave = hideTip;
  });
  main.querySelectorAll('.flow-band').forEach(band => {
    band.onmouseenter = () => { band.classList.add('hot'); flow.classList.add('dim'); };
    band.onmouseleave = () => { band.classList.remove('hot'); flow.classList.remove('dim'); hideTip(); };
  });
}

function destHtml(d) { return d ? `<span class="dest ${d}">${DEST_WORD[d] || d}</span>` : ''; }

function columnHtml(title, side, kind) {
  if (!side) return `<div><h3>${title}</h3><div class="muted">Not sent</div></div>`;
  return `<div><h3>${title}</h3><div class="eyebrow">Received</div><div class="mono">${tagged(side.received)}</div>
    <div class="eyebrow">Answer</div><div class="mono">${tagged(kind === 'cloud' ? side.answer_with_tags : side.answer)}</div></div>`;
}

async function renderDetail(id) {
  const holder = document.getElementById('detail');
  if (!holder || !id) { if (holder) holder.innerHTML = ''; return; }
  const data = await api(`/api/requests/${id}`);
  if (data.hidden) {
    holder.innerHTML = `<div class="detail"><div><h3>On device</h3><div class="muted">Privileged text is hidden from this view.</div></div><div><h3>Cloud</h3><div class="muted">Not sent</div></div></div>`;
    return;
  }
  const key = data.key && Object.keys(data.key).length ? Object.entries(data.key).map(([t, v]) => `<div><span class="tag">${esc(t)}</span> ${esc(v)}</div>`).join('') : '<div class="muted">None</div>';
  const cloudExtra = data.cloud ? `<div class="eyebrow">Key</div><div>${key}</div><div class="eyebrow" style="margin-top:10px">Shown to the person</div><div class="mono">${esc(data.cloud.answer)}</div>` : '';
  holder.innerHTML = `<div class="detail">${columnHtml('On device', data.box, 'box')}<div>${columnHtml('Cloud', data.cloud, 'cloud')}${cloudExtra}</div></div>`;
}

function setFilterOptions(id, options, value) {
  const select = document.getElementById(id);
  select.innerHTML = `<option value="">All</option>${options.map(([v, word]) => `<option value="${esc(v)}">${esc(word)}</option>`).join('')}`;
  select.value = value;
}

function renderRequests(data) {
  const main = document.getElementById('main');
  if (!document.getElementById('reqs')) {
    main.innerHTML = `<div class="filters"><span class="eyebrow">Person</span><select id="fuser" aria-label="Person"></select><span class="eyebrow">Task</span><select id="fkind" aria-label="Task"></select><span class="eyebrow">Where</span><select id="fdest" aria-label="Where"></select><button class="linkish muted" id="fclear" hidden>Clear filters</button><span class="muted" id="fcount"></span></div><div id="reqs"></div><div id="detail"></div>`;
    [['fuser', 'user'], ['fkind', 'kind'], ['fdest', 'dest']].forEach(([id, field]) => {
      document.getElementById(id).onchange = ev => { ui.filter[field] = ev.target.value; ui.selected = null; ui.pinned = false; ui.autoPick = true; ui.last = {}; tick(); };
    });
    document.getElementById('fclear').onclick = () => { ui.filter = { ...NO_FILTER }; ui.selected = null; ui.pinned = false; ui.last = {}; tick(); };
  }
  if (ui.autoPick) {
    ui.autoPick = false;
    if (data.requests.length) { ui.selected = data.requests[0].id; ui.pinned = true; ui.last.detail = null; }
  }
  setFilterOptions('fuser', ui.people.map(p => [p.user, p.name]), ui.filter.user);
  setFilterOptions('fkind', ui.kinds.map(k => [k, ui.tasks[k] || k]), ui.filter.kind);
  setFilterOptions('fdest', ROUTES.map(r => [r.id, r.word]), ui.filter.dest);
  document.getElementById('fclear').hidden = !(ui.filter.user || ui.filter.kind || ui.filter.dest);
  document.getElementById('fcount').textContent = data.total > data.requests.length ? `Newest ${data.requests.length} of ${data.total.toLocaleString()}` : plural(data.total);
  document.getElementById('reqs').innerHTML = data.requests.length
    ? `<table><tr><th>Task</th><th>Who</th><th>Where</th></tr>${data.requests.map(r => `<tr class="pick ${r.id === ui.selected ? 'chosen' : ''}" data-id="${r.id}"><td>${esc(r.label)}</td><td>${esc(r.name.split(' ')[0])}</td><td>${destHtml(r.destination)}</td></tr>`).join('')}</table>`
    : '<div class="muted empty-note">No requests match these filters.</div>';
  document.querySelectorAll('tr.pick').forEach(tr => tr.onclick = () => { ui.selected = Number(tr.dataset.id); ui.pinned = true; ui.last.detail = null; tick(); });
  if (!ui.pinned && data.latest_chat && data.latest_chat !== ui.selected && data.latest_chat !== ui.closedAt) ui.selected = data.latest_chat;
}

// Each person sits under whoever they report to.
function byHierarchy(people) {
  const ids = new Set(people.map(p => p.id));
  const out = [];
  const walk = (p, depth) => { out.push({ ...p, depth }); people.filter(x => x.reports_to === p.id).forEach(x => walk(x, depth + 1)); };
  people.filter(p => !ids.has(p.reports_to)).forEach(p => walk(p, 0));
  return out;
}

function armRemove(button, action) {
  button.onclick = async () => {
    if (button.dataset.armed) { await action(); ui.last = {}; tick(); return; }
    button.dataset.armed = '1'; button.textContent = 'Confirm';
    setTimeout(() => { delete button.dataset.armed; button.textContent = 'Remove'; }, 4000);
  };
}

function renderPeople(t) {
  const main = document.getElementById('main');
  if (!document.getElementById('peoplelist')) {
    main.innerHTML = `<form class="personform" id="personform" autocomplete="off">
      <input name="name" placeholder="Full name" aria-label="Full name" required>
      <input name="email" type="email" placeholder="Work email" aria-label="Work email" required>
      <input name="title" placeholder="Job title" aria-label="Job title">
      <input name="password" type="password" placeholder="Temporary password" aria-label="Temporary password" required minlength="8" autocomplete="new-password">
      <select name="role" id="newrole" aria-label="Role" hidden><option value="employee">Employee</option><option value="manager">Manager</option></select>
      <select name="reports_to" id="newboss" aria-label="Reports to" hidden></select>
      <button>Add person</button></form><div class="small" id="personreply" role="status"></div><div id="peoplelist"></div>`;
    document.getElementById('personform').onsubmit = async ev => {
      ev.preventDefault();
      const reply = document.getElementById('personreply');
      try {
        await post('/api/team', Object.fromEntries(new FormData(ev.target)));
        reply.textContent = `Added ${ev.target.elements.name.value}.`;
        ev.target.reset();
        ui.last = {}; tick();
      } catch (e) { reply.textContent = e.detail || 'Could not add that person.'; }
    };
  }
  const role = document.getElementById('newrole'), boss = document.getElementById('newboss');
  role.hidden = boss.hidden = !t.is_head;
  const picked = boss.value;
  boss.innerHTML = t.managers.map(m => `<option value="${esc(m.id)}">Reports to ${esc(m.name)}</option>`).join('');
  if (picked && t.managers.some(m => m.id === picked)) boss.value = picked; else boss.value = t.you;
  const row = p => {
    const editable = t.is_head && p.role !== 'head';
    const roleCell = editable ? `<select data-edit="${esc(p.id)}" data-field="role" aria-label="Role"><option value="employee" ${p.role === 'employee' ? 'selected' : ''}>Employee</option><option value="manager" ${p.role === 'manager' ? 'selected' : ''}>Manager</option></select>` : ROLE_WORD[p.role];
    const bossCell = editable ? `<select data-edit="${esc(p.id)}" data-field="reports_to" aria-label="Reports to">${t.managers.filter(m => m.id !== p.id).map(m => `<option value="${esc(m.id)}" ${m.id === p.reports_to ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>` : esc(p.reports_name);
    const canRemove = p.role !== 'head' && p.id !== t.you;
    return `<tr><td style="padding-left:${p.depth * 22}px"><div>${esc(p.name)}</div><div class="small">${esc(p.email || '')}</div></td><td>${esc(p.title || '')}</td><td>${roleCell}</td><td>${bossCell}</td><td class="right">${canRemove ? `<button class="remove" data-remove="${esc(p.id)}">Remove</button>` : ''}</td></tr>`;
  };
  document.getElementById('peoplelist').innerHTML = `<table class="people"><tr><th>Name</th><th>Title</th><th>Role</th><th>Reports to</th><th></th></tr>${byHierarchy(t.people).map(row).join('')}</table>`;
  document.querySelectorAll('[data-edit]').forEach(s => s.onchange = async () => {
    const reply = document.getElementById('personreply');
    try { await post(`/api/team/${s.dataset.edit}`, { [s.dataset.field]: s.value }); reply.textContent = 'Saved.'; }
    catch (e) { reply.textContent = e.detail || 'Could not save that.'; }
    ui.last = {}; tick();
  });
  document.querySelectorAll('[data-remove]').forEach(b => armRemove(b, () => post(`/api/team/${b.dataset.remove}/remove`)));
}

function termReply(r) {
  const parts = [`Added ${r.added}`];
  if (r.existing) parts.push(`${r.existing} already on the list`);
  if (r.skipped) parts.push(`${r.skipped} skipped because too short`);
  return parts.join(', ') + '.';
}

function renderTerms(t) {
  const more = t.count > t.terms.length ? `<div class="small">Showing the newest ${t.terms.length} of ${t.count.toLocaleString()}.</div>` : '';
  document.getElementById('termlist').innerHTML = (t.count
    ? t.terms.map(x => `<div class="item"><span>${esc(x.term)}</span><button class="remove" data-term="${x.id}">Remove</button></div>`).join('')
    : '<div class="muted empty-note">No names or private details on the list yet.</div>') + more;
  document.querySelectorAll('[data-term]').forEach(b => armRemove(b, () => post(`/api/masking/terms/${b.dataset.term}/remove`)));
}

function renderMasking(items, terms) {
  const known = ui.seenMask;
  ui.seenMask = new Set(items.map(i => i.id));
  const row = i => {
    const fresh = known && !known.has(i.id);
    const right = i.grp === 'default' ? `<button data-mask="${i.key}" data-on="${i.enabled ? 0 : 1}">${i.enabled ? 'On' : 'Off'}</button>`
      : i.grp === 'added' ? `<span class="small">${esc(i.added_by)} · ${clock(i.ts)}</span>` : '<span class="small">Fixed</span>';
    return `<div class="item ${fresh ? 'flash' : ''}" title="${esc(i.words || '')}"><span>${esc(i.label)}</span>${right}</div>`;
  };
  const group = (name, grp) => { const list = items.filter(i => i.grp === grp); return list.length ? `<div class="group"><div class="eyebrow">${name}</div>${list.map(row).join('')}</div>` : ''; };
  if (!document.getElementById('masklist')) {
    document.getElementById('main').innerHTML = `<section class="firmlist"><h2>Firm masking list</h2><p class="muted">Always masked before anything goes to the cloud, for everyone at the firm.</p>
      <form class="ruleform" id="termform"><input id="termtext" aria-label="Name or private detail" placeholder="Add a name or private detail" autocomplete="off"><button>Add</button><button type="button" id="termfile">Upload file</button><input id="termpick" type="file" accept=".txt,.csv" hidden></form>
      <div class="small" id="termreply" role="status"></div><div id="termlist"></div></section>
      <section class="firmlist"><h2>Masking rules</h2><form class="ruleform" id="ruleform"><input id="ruletext" aria-label="Masking rule" placeholder="Add a rule in plain words, like: mask all numbers" autocomplete="off"><button>Add</button></form><div class="small" id="rulereply"></div><div id="masklist"></div></section>`;
    const termReplyEl = document.getElementById('termreply');
    const refresh = () => { ui.last = {}; tick(); };
    document.getElementById('termform').onsubmit = async ev => {
      ev.preventDefault();
      const box = document.getElementById('termtext');
      if (!box.value.trim()) return;
      try { termReplyEl.textContent = termReply(await post('/api/masking/terms', { text: box.value })); box.value = ''; refresh(); }
      catch (e) { termReplyEl.textContent = e.detail || 'Could not add that.'; }
    };
    const pick = document.getElementById('termpick');
    document.getElementById('termfile').onclick = () => pick.click();
    pick.onchange = async () => {
      const file = pick.files[0];
      pick.value = '';
      if (!file) return;
      termReplyEl.textContent = `Reading ${file.name}…`;
      try { termReplyEl.textContent = termReply(await post('/api/masking/terms/upload', { filename: file.name, text: await file.text() })); refresh(); }
      catch (e) { termReplyEl.textContent = e.detail || 'Could not read that file.'; }
    };
    document.getElementById('ruleform').onsubmit = async ev => {
      ev.preventDefault();
      const box = document.getElementById('ruletext');
      const text = box.value.trim();
      if (!text) return;
      box.value = '';
      document.getElementById('rulereply').textContent = '…';
      const r = await post('/api/masking/rule', { text });
      document.getElementById('rulereply').textContent = r.reply;
      ui.last = {}; tick();
    };
  }
  renderTerms(terms);
  document.getElementById('masklist').innerHTML = group('Always', 'always') + group('Default', 'default') + group('Added', 'added');
  document.querySelectorAll('[data-mask]').forEach(b => b.onclick = async () => { await post('/api/masking/default', { name: b.dataset.mask, on: b.dataset.on === '1' }); ui.last = {}; tick(); });
}

function changed(name, value) {
  const json = JSON.stringify(value);
  if (ui.last[name] === json) return false;
  ui.last[name] = json;
  return true;
}

async function tick() {
  try {
    const board = await api('/api/board');
    ui.people = board.people; ui.tasks = board.tasks; ui.kinds = [...new Set(board.flow.map(r => r.kind))];
    if (ui.tab === 'board' && changed('board', [board.people, board.flow, board.savings, board.runs.day.running])) renderBoard(board);
    if (ui.tab === 'requests') {
      const query = new URLSearchParams(Object.entries(ui.filter).filter(([, v]) => v));
      const data = await api(`/api/requests?${query}`);
      if (changed('requests', [data, ui.selected])) renderRequests(data);
      if (ui.selected && changed('detail', [ui.selected, data.requests.find(r => r.id === ui.selected)])) await renderDetail(ui.selected);
    }
    if (ui.tab === 'masking') { const [m, t] = await Promise.all([api('/api/masking'), api('/api/masking/terms')]); if (changed('masking', [m, t])) renderMasking(m, t); }
    if (ui.tab === 'people') { const t = await api('/api/team'); if (changed('team', t)) renderPeople(t); }
  } catch (e) { if (e.signin) location.reload(); }
}

document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea, select')) return;
  if (ev.key === '1') go('board');
  if (ev.key === '2') go('requests');
  if (ev.key === '3' || ev.key === 'm') go('masking');
  if (ev.key === 'f') post('/api/day/start');
  if (ev.key === 'Escape') { ui.closedAt = ui.selected; ui.selected = null; ui.pinned = false; ui.last = {}; const d = document.getElementById('detail'); if (d) d.innerHTML = ''; }
});

signIn(root, EMBEDDED ? 'partner' : null, async () => {
  const me = await api('/api/me');
  if (!me.managing) { location.href = '/'; return; }
  shell();
  tick();
  setInterval(tick, 1000);
});
</script></body></html>
