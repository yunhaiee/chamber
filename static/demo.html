<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chamber</title><link rel="icon" href="/static/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="stage">
  <div class="switch" role="tablist">
    <button class="on" data-pane="maya" role="tab">Maya Chen</button>
    <button data-pane="daniel" role="tab">Daniel Osei</button>
  </div>
  <button id="reset" class="reset" type="button">Reset</button>
  <div class="stage-chat">
    <iframe id="maya" title="Maya Chen" src="/chat?pane=left"></iframe>
    <iframe id="daniel" title="Daniel Osei" src="/chat?pane=right" hidden></iframe>
  </div>
  <iframe id="board" title="Firm dashboard" src="/manage?pane=partner"></iframe>
</div>
<script>
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.switch button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('maya').hidden = b.dataset.pane !== 'maya';
  document.getElementById('daniel').hidden = b.dataset.pane !== 'daniel';
  const board = document.getElementById('board').contentWindow;
  if (board.setBoardPerson) board.setBoardPerson(b.dataset.pane);
});

// Two clicks, so a stray one on stage can't wipe the demo.
const reset = document.getElementById('reset');
let armed = null;
function settle(text) {
  clearTimeout(armed); armed = null;
  reset.classList.remove('armed');
  reset.disabled = false;
  reset.textContent = text;
  if (text !== 'Reset') setTimeout(() => { if (!armed) reset.textContent = 'Reset'; }, 3000);
}
reset.onclick = async () => {
  if (!armed) {
    reset.textContent = 'Erase all history?';
    reset.classList.add('armed');
    armed = setTimeout(() => settle('Reset'), 4000);
    return;
  }
  clearTimeout(armed);
  reset.disabled = true;
  reset.textContent = 'Resetting…';
  let status = 0;
  try {
    let session = '';
    try { session = sessionStorage.getItem('counsel-token-partner') || ''; } catch {}
    status = (await fetch('/api/demo-reset', { method: 'POST', headers: { 'x-session': session }, credentials: 'include' })).status;
  } catch {}
  if (status === 200) location.reload();
  else settle(status === 409 ? 'Still working, try shortly' : 'Reset failed');
};
</script></body></html>
